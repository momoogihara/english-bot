<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>English Conversation Bot</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      line-height: 1.6;
    }

    textarea {
      width: 100%;
      height: 100px;
      font-size: 16px;
      padding: 10px;
    }

    button {
      margin-top: 10px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }

    .result {
      margin-top: 30px;
      padding: 20px;
      background: #f5f5f5;
      border-radius: 10px;
    }

    .section {
      margin-bottom: 20px;
    }

    h2 {
      margin-bottom: 5px;
      color: #333;
    }

    .loading {
      color: gray;
      font-style: italic;
    }
  </style>
</head>
<body>
  <h1>English Conversation Bot</h1>

  <textarea id="message" placeholder="英語を入力してください"></textarea>
  <br />
  <button onclick="sendMessage()">Send</button>

  <div id="result" class="result" style="display:none;">
    <div class="section">
      <h2>Corrected sentence</h2>
      <div id="corrected"></div>
    </div>

    <div class="section">
      <h2>Reply</h2>
      <div id="reply"></div>
    </div>

    <div class="section">
      <h2>Explanation</h2>
      <div id="explanation"></div>
    </div>
  </div>

  <script>
    async function sendMessage() {
      const message = document.getElementById("message").value;
      const resultDiv = document.getElementById("result");

      if (!message.trim()) {
        alert("メッセージを入力してください。");
        return;
      }

      resultDiv.style.display = "block";
      document.getElementById("corrected").innerHTML =
        '<span class="loading">Loading...</span>';
      document.getElementById("reply").innerHTML = "";
      document.getElementById("explanation").innerHTML = "";

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: message
          })
        });

        const data = await response.json();

        document.getElementById("corrected").textContent =
          data.corrected_sentence;

        document.getElementById("reply").textContent =
          data.reply;

        document.getElementById("explanation").textContent =
          data.explanation;
      } catch (error) {
        document.getElementById("corrected").textContent =
          "エラーが発生しました。";
        console.error(error);
      }
    }
  </script>
</body>
</html>
