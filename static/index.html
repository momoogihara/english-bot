<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>English Conversation Bot</title>

  <style>
   .container {
  display: flex;
  height: 90vh;
}

.chat-box {
  flex: 2;
  padding: 10px;
  overflow-y: auto;
  background: #f7f7f7;
}

.side-panel {
  flex: 1;
  padding: 10px;
  border-left: 1px solid #ddd;
}

.message {
  max-width: 70%;
  padding: 10px;
  margin: 5px;
  border-radius: 10px;
}

.user {
  background: #daf7a6;
  margin-left: auto;
  text-align: right;
}

.bot {
  background: #fff;
  margin-right: auto;
}
  </style>
</head>
<body>
  <h1>English Conversation Bot</h1>
  <!-- Chat area -->
  <div id="chat-box" class="chat-box"></div>

  <!-- Right panel -->
  <div class="side-panel">
    <h3>Corrected Sentence</h3>
    <div id="corrected"></div>

    <h3>Explanation</h3>
    <div id="explanation"></div>
  </div>
</div>

<input id="input" type="text" placeholder="Type message..." />
  <script>
    const chatBox = document.getElementById("chat-box");
const input = document.getElementById("input");

let history = [];

input.addEventListener("keydown", function (e) {
  if (e.key === "Enter") {
    sendMessage();
  }
});

async function sendMessage() {
  const text = input.value;
  if (!text) return;

  // User message
  addMessage("user", text);
  input.value = "";

  const res = await fetch("/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message: text }),
  });

  const data = await res.json();

  // Bot message
  addMessage("bot", data.reply);

  // Right panel update
  document.getElementById("corrected").innerText = data.corrected_sentence;
  document.getElementById("explanation").innerText = data.explanation;
}

function addMessage(role, text) {
  const div = document.createElement("div");
  div.classList.add("message", role);
  div.innerText = text;
  chatBox.appendChild(div);

  chatBox.scrollTop = chatBox.scrollHeight;
}
input.addEventListener("keydown", function (e) {
  if (e.key === "Enter") {
    sendMessage();
  }
});
  </script>
</body>
</html>
