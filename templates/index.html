<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>English Conversation Bot</title>

  <!-- CSS 読み込み -->
  <link rel="stylesheet" href="/static/style.css">
</head>

<body>

  <!-- 左側：チャットエリア -->
  <div class="chat-container">
    <div id="chat-box" class="chat-box"></div>

    <div class="input-area">
      <input
        id="input"
        type="text"
        placeholder="Type your message..."
      >
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <!-- 右側：Learning Area -->
  <div class="side-panel">
    <h3>Corrected Sentence</h3>
    <div id="corrected"></div>

    <h3>
      Explanation
      <span
        id="infoBtn"
        style="cursor: pointer; margin-left: 8px;"
        title="日本語解説を表示"
      >
        ℹ️
      </span>
    </h3>

    <div id="explanation_en"></div>

    <div id="ja-section">
      <h3>説明（日本語）</h3>
      <div id="explanation_ja"></div>
    </div>
  </div>

  <!-- JavaScript 読み込み -->
  <script src="/static/script.js"></script>

</body>
</html>
